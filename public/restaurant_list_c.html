<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurant List</title>
    <link rel="stylesheet" href="menu.css">
    <link rel="stylesheet" href="restaurant_list.css">
</head>
<body data-search-keyword="카레">

    <div class="mobile-container">
        <header class="page-header">
            <a href="menu_result.html"><img src="./images/icon-back-arrow.png" alt="뒤로 가기"></a>
            <h1>음식점 선택하기</h1>
        </header>

        <main class="content">
            <div class="question-card">
                <p>원하는 음식점을 선택해주세요!</p>
            </div>

            <div class="separator">
                <p>︾</p>
            </div>

            <div class="restaurant-list-container">
                <div class="restaurant-list">
                    
                    <div class="restaurant-item" data-restaurant="pohands">
                        <div class="restaurant-info">
                            <div class="info-header">
                                <span class="restaurant-name">반지하돈부리</span>
                                <div class="distance-info">
                                    <span class="restaurant-distance">⭐인기⭐</span>
                                </div>
                            </div>
                            <p class="restaurant-address">서울 동대문구 망우로18다길 44</p>
                        </div>
                    </div>

                    <!-- Tmap API로 동적으로 추가되는 음식점 목록 -->
                    <div id="tmapRestaurants"></div>
                </div>
            </div>
        </main>
        
        <div class="action-buttons">
             <a href="menu_recommend.html" class="btn btn-secondary" style="text-decoration: none; display: flex; justify-content: center; align-items: center;">뒤로 가기</a>
             <button class="btn btn-primary confirm-btn">음식점 확인하기</button>
        </div>

        <nav class="bottom-nav">
             <a href="main.html" class="nav-item">
                 <img src="./images/icon-home.png" alt="홈">
                 <span>홈</span>
            </a>
            <a href="map_main.html" class="nav-item active">
                 <img src="./images/icon-map.png" alt="지도">
                 <span>지도</span>
            </a>
            <a href="my_info.html" class="nav-item">
                 <img src="./images/icon-user.png" alt="내정보">
                 <span>내정보</span>
            </a>
        </nav>
    </div> <div class="modal-overlay"></div>

    <div id="restaurantDetailModal" class="modal">
        <div class="modal-header">
            <button class="close-button"><img src="./images/icon_close.png" alt="닫기"></button>
            <h2>매장 상세 안내</h2>
        </div>
        
        <div class="detail-modal-content">
            <h3 id="modalStoreName">가게 이름</h3>
            <p id="modalStoreAddress">가게 주소</p>
            <p id="modalStoreRating" class="restaurant-rating">★★★★☆ 4.5 (128)</p>
            <span class="tag">엘레베이터 사용 가능</span>
        </div>
        
        <div class="action-buttons modal-buttons">
            <button class="btn btn-secondary close-modal-btn">뒤로 가기</button>
            
            <a href="voice_guide.html" class="btn btn-primary" style="text-decoration: none; display: flex; justify-content: center; align-items: center;">
                키오스크 음성안내
            </a>
        </div>
    </div>
    <script src="restaurant_list.js"></script>
</body>
</html>
