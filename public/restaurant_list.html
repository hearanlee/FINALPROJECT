<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurant List</title>
    <link rel="stylesheet" href="menu.css">
</head>
<body>

    <div class="mobile-container">
        <header class="page-header">
            <a href="menu_result.html"><img src="./images/icon-back-arrow.png" alt="뒤로 가기"></a>
            <h1>음식점 선택하기</h1>
        </header>

        <main class="content">
            <div class="question-card">
                <p>원하는 음식점을 선택해주세요!</p>
            </div>

            <div class="separator">
                <p>︾</p>
            </div>

            <div class="restaurant-list">
                <div class="restaurant-item">
                    <img src="./images/restaurant1.png" alt="포핸즈" class="restaurant-image">
                    <div class="restaurant-info">
                        <div class="info-header">
                            <span class="restaurant-name">포핸즈</span>
                            <span class="restaurant-distance">345m</span>
                        </div>
                        <p class="restaurant-rating">★★★★☆ 4.5 (128)</p>
                        <p class="restaurant-address">서울 동대문구 전농로 222 2층</p>
                    </div>
                </div>
                <div class="restaurant-item">
                    <img src="./images/restaurant2.png" alt="타인플레이트" class="restaurant-image">
                    <div class="restaurant-info">
                        <div class="info-header">
                            <span class="restaurant-name">타인플레이트</span>
                            <span class="restaurant-distance">463m</span>
                        </div>
                        <p class="restaurant-rating">★★★★☆ 4.5 (128)</p>
                        <p class="restaurant-address">서울 동대문구 이문로 17-26 1층</p>
                    </div>
                </div>
                <div class="restaurant-item">
                    <img src="./images/restaurant3.png" alt="반포식스" class="restaurant-image">
                    <div class="restaurant-info">
                        <div class="info-header">
                            <span class="restaurant-name">반포식스 청량리역점</span>
                            <span class="restaurant-distance">770m</span>
                        </div>
                        <p class="restaurant-rating">★★★★☆ 4.5 (128)</p>
                        <p class="restaurant-address">서울 동대문구 왕산로 214 3층</p>
                    </div>
                </div>
            </div>
        </main>
        
        <div class="action-buttons">
             <a href="menu_recommend.html" class="btn btn-secondary" style="text-decoration: none; display: flex; justify-content: center; align-items: center;">메뉴 다시 고르기</a>
             <button id="confirmBtn" class="btn btn-primary">음식점 확인하기</button>
        </div>

        <nav class="bottom-nav">
             <a href="main.html" class="nav-item">
                <img src="./images/icon-home.png" alt="홈">
                <span>홈</span>
            </a>
            <a href="map_main.html" class="nav-item active">
                <img src="./images/icon-map.png" alt="지도">
                <span>지도</span>
            </a>
            <a href="my_info.html" class="nav-item">
                <img src="./images/icon-user.png" alt="내정보">
                <span>내정보</span>
            </a>
        </nav>
    </div>
    <script src="restaurant_list.js"></script>
</body>
</html>
