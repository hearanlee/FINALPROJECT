<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Recommendation</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍽️</text></svg>">
    <link rel="stylesheet" href="menu.css">
    <link rel="stylesheet" href="menu_recommend.css">
    <link rel="stylesheet" href="voice_guide.css">
    
    <script type="importmap">
    {
      "imports": {
        "@google/genai": "/lib/index.mjs"
      }
    }
    </script>
</head>
<body>

    <div class="mobile-container">
        <header class="page-header">
            <a href="main.html"><img src="./images/icon-back-arrow.png" alt="뒤로 가기"></a>
            <h1>음성안내</h1>
        </header>

        <main class="content">
            <div class="question-card" style="margin-top: 20px;">
                <p id="main-question-text">주문하실 메뉴명을 말하시거나<br>메뉴 둘러보기를 원하시면<br>'메뉴'라고 말씀해주세요</p>
            </div>
            <div class="voice-icon-container">
                <img src="./images/icon_voice_mic.png" alt="음성 안내 시작" class="voice-mic-icon">
                <div class="volume-controls">
                    <span id="font-increase-btn" class="volume-btn">+</span>
                    <span id="font-decrease-btn" class="volume-btn">-</span>
                </div>
            </div>
            <p id="main-instruction-text" class="instruction-text">마이크 버튼을 누르시면<br>키오스크 음성안내가 시작됩니다.</p>
        </main>
        
        <div class="voice-action-buttons">
            <div class="button-row">
                <button id="speedBtn" class="btn btn-secondary"><img src="./images/icon_slow.png" class="btn-icon" alt=""> 느린 음성</button>
                <button id="repeatBtn" class="btn btn-secondary"><img src="./images/icon_repeat.png" class="btn-icon" alt=""> 반복 재생</button>
            </div>
            <button class="btn btn-secondary full-width" style="margin-bottom: 10px;">⛔ 화면과 음성이 맞지 않음</button>
            
            <button id="exitVoiceGuideBtn" class="btn btn-primary full-width">음성안내 종료</button>
        </div>

        <nav class="bottom-nav">
            <a href="main.html" class="nav-item active">
                <img src="./images/icon-home-filled.png" alt="홈">
                <span>홈</span>
            </a>
            <a href="map_main.html" class="nav-item">
                <img src="./images/icon-map.png" alt="지도">
                <span>지도</span>
            </a>
            <a href="my_info.html" class="nav-item">
                <img src="./images/icon-user.png" alt="내정보">
                <span>내정보</span>
            </a>
        </nav>
    </div>

    <div class="modal-overlay"></div>
    <div id="speedModal" class="modal">
        <div class="modal-header">
            <button class="close-button"><img src="./images/icon_close.png" alt="닫기"></button>
            <h2>음성 속도 조절</h2>
        </div>
        <p class="modal-subtitle">원하는 속도를 선택해주세요</p>
        <div class="slider-container">
            <div class="slider-bar-wrapper">
                <div class="slider-track"></div>
                <div class="slider-points">
                    <div class="slider-point"></div>
                    <div class="slider-point active"></div>
                    <div class="slider-point"></div>
                </div>
            </div>
            <div class="slider-labels">
                <div class="label-item"><img src="./images/icon_turtle.png" alt="느림"><br>느림</div>
                <div class="label-item active">보통</div>
                <div class="label-item"><img src="./images/icon_rabbit.png" alt="빠름"><br>빠름</div>
            </div>
        </div>
    </div>
    <div id="repeatModal" class="modal">
        <div class="modal-header">
            <button class="close-button"><img src="./images/icon_close.png" alt="닫기"></button>
            <h2>반복 재생 설정</h2>
        </div>
        <p class="modal-subtitle">원하는 반복 횟수를 선택해주세요</p>
        <div class="slider-container">
            <div class="slider-bar-wrapper">
                <div class="slider-track"></div>
                <div class="slider-points">
                    <div class="slider-point active"></div>
                    <div class="slider-point"></div>
                    <div class="slider-point"></div>
                </div>
            </div>
            <div class="slider-labels">
                <div class="label-item active">X 1</div>
                <div class="label-item">X 2</div>
                <div class="label-item">X 3</div>
            </div>
        </div>
    </div>
    <script type="module" src="menu_recommend.js?v=2"></script>
    
    <!-- 페이지 로드 시 자동 음성 안내 -->
    <script>
        // 음성 안내 재생 함수
        function playWelcomeMessage() {
            // 2. 브라우저가 음성 합성을 지원하는지 확인
            if ('speechSynthesis' in window) {
                
                // 3. 안내할 텍스트 정의
                const ttsText = "마이크 버튼을 누르시면, 오늘의 메뉴를 추천해드릴게요";
                
                // 4. 음성 메시지 객체 생성
                const utterance = new SpeechSynthesisUtterance(ttsText);
                
                // 5. 한국어로 설정 (정확한 발음을 위해 중요)
                utterance.lang = 'ko-KR';
                utterance.rate = 1.0; // 재생 속도 (1이 기본값)
                
                // 6. 음성 재생 실행
                try {
                    // 기존에 재생 중인 음성이 있으면 중지
                    window.speechSynthesis.cancel();
                    
                    window.speechSynthesis.speak(utterance);
                    console.log('TTS 음성 안내 시작');
                } catch (e) {
                    console.error('TTS 재생 오류:', e);
                }
            } else {
                // 음성 합성을 지원하지 않는 브라우저의 경우
                console.error("이 브라우저는 음성 합성을 지원하지 않습니다.");
            }
        }
        
        // 1. 페이지 로드가 완료되면 함수 실행
        window.addEventListener('load', function() {
            // 자동 재생 정책을 고려하여 사용자 상호작용 후 재생 시도
            // 약간의 지연을 두고 재생 시도
            setTimeout(() => {
                playWelcomeMessage();
            }, 300);
        });
        
        // 사용자의 첫 상호작용(클릭/터치) 시 음성 재생
        // 자동 재생 정책을 우회하기 위한 방법
        let hasPlayed = false;
        function handleFirstInteraction() {
            if (!hasPlayed && 'speechSynthesis' in window) {
                hasPlayed = true;
                playWelcomeMessage();
                // 이벤트 리스너 제거 (한 번만 실행)
                document.removeEventListener('click', handleFirstInteraction);
                document.removeEventListener('touchstart', handleFirstInteraction);
            }
        }
        
        // 클릭 및 터치 이벤트 리스너 추가
        document.addEventListener('click', handleFirstInteraction, { once: true });
        document.addEventListener('touchstart', handleFirstInteraction, { once: true });
    </script>
</body>
</html>
