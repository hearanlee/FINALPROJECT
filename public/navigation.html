<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="menu.css">
    <style>

        .btn {

</head>
<body>

    <div class="mobile-container">
        <div class="navigation-container">
            <div id="map"></div>
            
            <div id="loadingMessage" class="loading-message">
                <div>📍 현재 위치를 확인하는 중...</div>
                <div style="font-size: 12px; margin-top: 5px; color: #666;">
                    GPS를 사용하여 정확한 위치를 찾고 있습니다.<br>

            <div id="errorMessage" class="error-message" style="display: none;">
                <div>위치 정보를 가져올 수 없습니다.</div>

            </div>

            <header class="page-header nav-header">
                <a href="map_main.html"><img src="./images/icon-back-arrow.png" alt="뒤로 가기"></a>

            <a href="map_main.html" class="btn back-button-floating btn-floating-style">뒤로 가기</a>
            
            <div id="remainingDistanceDisplay" class="remaining-distance-display" style="display: none;">
                <div class="distance-text" id="remainingDistanceText">-</div>

            <div class="action-buttons bottom-buttons-floating">

        <nav class="bottom-nav">
             <a href="main.html" class="nav-item">
                <img src="./images/icon-home.png" alt="홈">
                <span>홈</span>
            </a>
            <a href="map_main.html" class="nav-item active">
                <img src="./images/icon-map.png" alt="지도">
                <span>지도</span>
            </a>
            <a href="my_info.html" class="nav-item">

    </div>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.2.1.min.js"></script>
    <!-- Tmap API 직접 로드 (document.write 경고 무시) -->
    <script src="https://apis.openapi.sk.com/tmap/jsv2?version=1&appKey=pUIcUWdIGX4FDdOOgd0SO8n46k4ZNmiV6TOOJetL"></script>
    <script>
        // Tmap API 로드 상태 관리
        window.tmapApiLoaded = false;
        window.tmapApiLoadError = false;
        
        // Tmap API 로드 확인 함수
        function checkTmapApi() {
            if (typeof Tmapv2 !== 'undefined' && Tmapv2 && typeof Tmapv2.LatLng !== 'undefined') {
                window.tmapApiLoaded = true;
                console.log('Tmap API 완전히 로드됨');
                return true;
            }
            return false;
        }
        
        // 페이지 로드 시 API 확인
        window.addEventListener('load', function() {
            console.log('페이지 로드 완료, Tmap API 확인 중...');
            if (checkTmapApi()) {
                console.log('Tmap API가 이미 로드됨');
            } else {
                console.log('Tmap API 로드 대기 중...');
                // 1초마다 확인
                var checkInterval = setInterval(function() {
                    if (checkTmapApi()) {
                        clearInterval(checkInterval);
                    }
                }, 1000);
                
                // 10초 후 타임아웃
                setTimeout(function() {
                    if (!window.tmapApiLoaded) {
                        clearInterval(checkInterval);
                        window.tmapApiLoadError = true;
                        console.error('Tmap API 로드 타임아웃');
                    }
                }, 10000);
            }
        });
    </script>
    <script>
        let map;
        let currentPosition;
        let destinationPosition;
        let watchId; // 위치 추적 ID
        let currentMarkers = []; // 현재 표시된 마커들
        let currentPolylines = []; // 현재 표시된 경로들
        let currentOverlays = []; // 현재 표시된 오버레이들
        let resultdrawArr = []; // Tmap 경로 그리기 배열
        let lastDistanceUpdatePosition = null; // 마지막으로 거리를 갱신한 위치

        // 목적지 좌표 (URL 파라미터에서 가져옴)
        let destinationCoords = {
            lat: 37.5839449,
            lng: 127.0535993,
            name: '포핸즈'
        };
        
        // URL 파라미터에서 좌표 정보 가져오기
        function getUrlParameters() {
            const urlParams = new URLSearchParams(window.location.search);
            const startLat = parseFloat(urlParams.get('startLat'));
            const startLng = parseFloat(urlParams.get('startLng'));
            const endLat = parseFloat(urlParams.get('endLat'));
            const endLng = parseFloat(urlParams.get('endLng'));
            
            console.log('URL 파라미터:', { startLat, startLng, endLat, endLng });
            
            // 목적지 좌표 설정
            if (!isNaN(endLat) && !isNaN(endLng)) {
                destinationCoords = {
                    lat: endLat,
                    lng: endLng,
                    name: '선택된 목적지'
                };
                console.log('목적지 설정됨:', destinationCoords);
            }
            
            // 출발지 좌표가 있으면 현재 위치로 설정
            if (!isNaN(startLat) && !isNaN(startLng)) {
                currentPosition = {
                    lat: startLat,
                    lng: startLng,
                    accuracy: 10, // 기본 정확도
                    altitude: null,
                    heading: null,
                    speed: null
                };
                console.log('출발지 설정됨:', currentPosition);
                return true; // URL에서 좌표를 가져왔음을 표시
            }
            
            return false; // URL에서 좌표를 가져오지 못함
        }

        // 기존 마커와 경로 제거 함수
        function clearMap() {
            // 기존 마커들 제거
            currentMarkers.forEach(marker => {
                marker.setMap(null);
            });
            currentMarkers = [];

            // 기존 경로들 제거
            currentPolylines.forEach(polyline => {
                polyline.setMap(null);
            });
            currentPolylines = [];

            // Tmap 경로 제거
            if (resultdrawArr.length > 0) {
                for (let i in resultdrawArr) {
                    resultdrawArr[i].setMap(null);
                }
                resultdrawArr = [];
            }

            // 기존 오버레이들 제거
            currentOverlays.forEach(overlay => {
                overlay.setMap(null);
            });
            currentOverlays = [];
        }

        // 거리 체크 및 팝업 표시 함수
        function checkDistanceAndShowPopup() {
            if (!currentPosition || !destinationCoords) return false;

            const distance = calculateDistance(
                currentPosition.lat, currentPosition.lng,
                destinationCoords.lat, destinationCoords.lng
            );

            const distanceKm = distance / 1000;

            if (distanceKm > 30) {
                // 30km 초과 시 팝업 표시
                showDistancePopup(distanceKm);
                return false;
            }

            return true;
        }

        // 거리 초과 팝업 표시
        function showDistancePopup(distanceKm) {
            const popup = document.createElement('div');
            popup.style.cssText = `
                position: fixed;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                background: white;
                border: 2px solid #0D2A5C;
                border-radius: 15px;
                padding: 30px;
                box-shadow: 0 4px 20px rgba(0,0,0,0.3);
                z-index: 1000;
                text-align: center;
                max-width: 300px;
                font-family: Arial, sans-serif;
            `;

            popup.innerHTML = `
                <div style="margin-bottom: 20px;">
                    <div style="font-size: 24px; margin-bottom: 10px;">🚫</div>
                    <h3 style="margin: 0 0 15px 0; color: #0D2A5C;">거리 초과</h3>
                    <p style="margin: 0 0 10px 0; color: #666; font-size: 14px;">
                        현재 위치에서 목적지까지의 거리가<br>
                        <strong style="color: #0D2A5C;">${Math.round(distanceKm * 10) / 10}km</strong>입니다.
                    </p>
                    <p style="margin: 0; color: #999; font-size: 12px;">
                        도보 길찾기는 30km 이내에서만 제공됩니다.
                    </p>
                </div>
                <button onclick="this.parentElement.remove()" style="
                    background: #0D2A5C;
                    color: white;
                    border: none;
                    padding: 10px 20px;
                    border-radius: 5px;
                    cursor: pointer;
                    font-size: 14px;
                ">확인</button>
            `;

            document.body.appendChild(popup);

            // 5초 후 자동 제거
            setTimeout(() => {
                if (popup.parentElement) {
                    popup.remove();
                }
            }, 5000);
        }

        // 현재 위치 가져오기 (HTML5 Geolocation) - 정확도 개선
        function getCurrentLocation() {
            return new Promise((resolve, reject) => {
                if (!navigator.geolocation) {
                    reject(new Error('이 브라우저는 위치 서비스를 지원하지 않습니다.'));
                    return;
                }

                console.log('현재 위치를 요청합니다... (고정밀 모드)');
                
                // 여러 번 시도하여 가장 정확한 위치 찾기
                let bestPosition = null;
                let attempts = 0;
                const maxAttempts = 1;
                const minAccuracy = 50; // 50m 이하의 정확도 목표
                
                function tryGetPosition() {
                    attempts++;
                    console.log(`위치 시도 ${attempts}/${maxAttempts}`);
                
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                            const accuracy = position.coords.accuracy;
                            console.log(`시도 ${attempts} - 정확도: ${Math.round(accuracy)}m`);
                            
                            // 더 정확한 위치이거나 첫 번째 시도인 경우 업데이트
                            if (!bestPosition || accuracy < bestPosition.coords.accuracy) {
                                bestPosition = position;
                                console.log(`더 정확한 위치 발견: ${Math.round(accuracy)}m`);
                            }
                            
                            // 충분히 정확하거나 최대 시도 횟수에 도달한 경우
                            if (accuracy <= minAccuracy || attempts >= maxAttempts) {
                                if (bestPosition) {
                        currentPosition = {
                                        lat: bestPosition.coords.latitude,
                                        lng: bestPosition.coords.longitude,
                                        accuracy: bestPosition.coords.accuracy,
                                        altitude: bestPosition.coords.altitude,
                                        heading: bestPosition.coords.heading,
                                        speed: bestPosition.coords.speed
                                    };
                                    
                                    console.log('최종 위치 정보:');
                        console.log('- 위도:', currentPosition.lat);
                        console.log('- 경도:', currentPosition.lng);
                        console.log('- 정확도:', Math.round(currentPosition.accuracy) + 'm');
                                    console.log('- 고도:', currentPosition.altitude ? Math.round(currentPosition.altitude) + 'm' : 'N/A');
                        
                        resolve(currentPosition);
                                } else {
                                    reject(new Error('유효한 위치 정보를 얻을 수 없습니다.'));
                                }
                            } else {
                                // 더 정확한 위치를 위해 다시 시도
                                setTimeout(tryGetPosition, 2000);
                            }
                    },
                    (error) => {
                            console.error(`시도 ${attempts} 실패:`, error);
                            
                            if (attempts >= maxAttempts) {
                        let errorMessage = '위치 정보를 가져올 수 없습니다.';
                        
                        switch(error.code) {
                            case error.PERMISSION_DENIED:
                                errorMessage = '위치 권한이 거부되었습니다. 브라우저 설정에서 위치 권한을 허용해주세요.';
                                break;
                            case error.POSITION_UNAVAILABLE:
                                        errorMessage = '위치 정보를 사용할 수 없습니다. GPS 신호가 약한 것 같습니다.';
                                break;
                            case error.TIMEOUT:
                                errorMessage = '위치 요청 시간이 초과되었습니다. 다시 시도해주세요.';
                                break;
                        }
                        
                        reject(new Error(errorMessage));
                            } else {
                                // 재시도
                                setTimeout(tryGetPosition, 3000);
                            }
                    },
                    {
                        enableHighAccuracy: true,    // GPS 사용
                            timeout: 20000,              // 20초 타임아웃 (더 길게)
                            maximumAge: 0               // 캐시된 위치 사용 안함 (항상 새로운 위치)
                    }
                );
                }
                
                tryGetPosition();
            });
        }

        // Tmap 지도 초기화
        function initMap() {
            if (typeof Tmapv2 === 'undefined' || !Tmapv2 || typeof Tmapv2.LatLng === 'undefined') {
                console.error('Tmap API가 완전히 로드되지 않았습니다.');
                console.error('Tmapv2:', typeof Tmapv2);
                console.error('Tmapv2.LatLng:', typeof Tmapv2?.LatLng);
                showError('지도 API를 불러올 수 없습니다.');
                return;
            }

            // 기존 마커와 경로 제거
            clearMap();

            // 거리 체크
            const isWithinRange = checkDistanceAndShowPopup();

            // Tmap 지도 생성 (현재 위치를 중심으로)
            const mapContainer = document.getElementById('map');
            map = new Tmapv2.Map(mapContainer, {
                center: new Tmapv2.LatLng(currentPosition.lat, currentPosition.lng),
                width: "100%",
                height: "100%",
                zoom: 15,
                zoomControl: true,
                scrollwheel: true
            });

            // 현재 위치 마커 추가
            if (currentPosition) {
                const currentMarker = new Tmapv2.Marker({
                    position: new Tmapv2.LatLng(currentPosition.lat, currentPosition.lng),
                    icon: "https://t1.daumcdn.net/localimg/localimages/07/mapapidoc/red_b.png",
                    iconSize: new Tmapv2.Size(24, 35),
                    map: map
                });
                currentMarkers.push(currentMarker);

            }

            // 목적지 마커 추가
            const destinationMarker = new Tmapv2.Marker({
                position: new Tmapv2.LatLng(destinationCoords.lat, destinationCoords.lng),
                icon: "https://t1.daumcdn.net/localimg/localimages/07/mapapidoc/blue_drag.png",
                iconSize: new Tmapv2.Size(24, 35),
                map: map
            });
            currentMarkers.push(destinationMarker);

            // 목적지 인포윈도우 제거됨

                // 두 지점을 모두 포함하도록 지도 범위 조정
                adjustMapBounds();

                // 경로 표시 (30km 이내면 상세 경로, 초과하면 직선 경로)
                if (isWithinRange) {
                    showRoute();
                } else {
                    showStraightRoute();
            }

            // 로딩 메시지 숨기기
            document.getElementById('loadingMessage').style.display = 'none';
        }

        // 지도 범위 조정 (두 지점을 모두 포함)
        function adjustMapBounds() {
            if (!currentPosition || !destinationCoords) return;

            try {
                // 두 지점의 좌표를 LatLngBounds에 추가
                const bounds = new Tmapv2.LatLngBounds();
                bounds.extend(new Tmapv2.LatLng(currentPosition.lat, currentPosition.lng));
                bounds.extend(new Tmapv2.LatLng(destinationCoords.lat, destinationCoords.lng));

                // 지도 범위를 두 지점을 모두 포함하도록 조정
                map.fitBounds(bounds);

                // 여백을 위해 약간 확대
                const currentZoom = map.getZoom();
                if (currentZoom > 1) {
                    map.setZoom(currentZoom - 1);
                }

                console.log('지도 범위가 두 지점을 포함하도록 조정되었습니다.');
            } catch (error) {
                console.error('지도 범위 조정 오류:', error);
            }
        }

        // Tmap 도보 경로 API를 사용한 실제 경로 표시
        function showRoute() {
            if (!currentPosition || !destinationCoords) return;

            try {
                console.log('Tmap 도보 경로 API 호출 중...');

                const headers = {}; 
                headers["appKey"] = "pUIcUWdIGX4FDdOOgd0SO8n46k4ZNmiV6TOOJetL";

                $.ajax({
                    method: "POST",
                    headers: headers,
                    url: "https://apis.openapi.sk.com/tmap/routes/pedestrian?version=1&format=json&callback=result",
                    async: false,
                    data: {
                        "startX": currentPosition.lng.toString(),
                        "startY": currentPosition.lat.toString(),
                        "endX": destinationCoords.lng.toString(),
                        "endY": destinationCoords.lat.toString(),
                        "reqCoordType": "WGS84GEO",
                        "resCoordType": "EPSG3857",
                        "startName": "현재 위치",
                        "endName": destinationCoords.name
                    },
                    success: function(response) {
                        console.log('Tmap API 응답:', response);
                        processTmapRouteData(response);
                    },
                    error: function(request, status, error) {
                        console.error("Tmap API 오류:", request.status, request.responseText, error);
                showStraightRoute();
                    }
                });

            } catch (error) {
                console.error('경로 표시 오류:', error);
                showStraightRoute();
            }
        }

        // Tmap API 응답 처리 함수
        function processTmapRouteData(data) {
            try {
                if (data.features && data.features[0]) {
                    const resultData = data.features;
                    
                    // 결과 출력
                    const totalDistance = resultData[0].properties.totalDistance;
                    const totalTime = resultData[0].properties.totalTime;
                    
                    console.log(`Tmap 경로 - 거리: ${(totalDistance / 1000).toFixed(1)}km, 시간: ${(totalTime / 60).toFixed(0)}분`);
                    
                    // 기존 그려진 라인 & 마커가 있다면 초기화
                    if (resultdrawArr.length > 0) {
                        for (let i in resultdrawArr) {
                            resultdrawArr[i].setMap(null);
                        }
                        resultdrawArr = [];
                    }
                    
                    let drawInfoArr = [];

                    for (let i in resultData) {
                        const geometry = resultData[i].geometry;
                        const properties = resultData[i].properties;

                        if (geometry.type == "LineString") {
                            for (let j in geometry.coordinates) {
                                // 경로들의 결과값(구간)들을 포인트 객체로 변환 
                                const latlng = new Tmapv2.Point(
                                    geometry.coordinates[j][0],
                                    geometry.coordinates[j][1]);
                                // 포인트 객체를 받아 좌표값으로 변환
                                const convertPoint = new Tmapv2.Projection.convertEPSG3857ToWGS84GEO(latlng);
                                // 포인트객체의 정보로 좌표값 변환 객체로 저장
                                const convertChange = new Tmapv2.LatLng(
                                    convertPoint._lat,
                                    convertPoint._lng);
                                // 배열에 담기
                                drawInfoArr.push(convertChange);
                            }
                        }
                    }
                    
                    // 경로 그리기
                    drawTmapLine(drawInfoArr, totalDistance, totalTime);

                } else {
                    console.warn('경로 정보를 찾을 수 없습니다. 직선 경로를 표시합니다.');
                    showStraightRoute();
                }
            } catch (error) {
                console.error('Tmap 경로 데이터 처리 오류:', error);
                showStraightRoute();
            }
        }

        // Tmap 경로 그리기 함수
        let estimatedTimeSeconds = null; // 예상 시간 저장 (초 단위)
        
        function drawTmapLine(arrPoint, distance, time) {
            const polyline = new Tmapv2.Polyline({
                path: arrPoint,
                strokeColor: "#0D2A5C",
                strokeWeight: 6,
                map: map
            });
            resultdrawArr.push(polyline);
            
            // 예상 시간 저장 (초 단위)
            estimatedTimeSeconds = time;
            
            // 거리 갱신 (예상 시간 정보와 함께)
            updateRemainingDistance();
        }

        // 직선 경로 표시 (API 실패 시 대체)
        function showStraightRoute() {
            try {
                // 출발지와 도착지 사이에 중간점들을 추가하여 더 자연스러운 경로 생성
                const startLat = currentPosition.lat;
                const startLng = currentPosition.lng;
                const endLat = destinationCoords.lat;
                const endLng = destinationCoords.lng;
                
                // 중간점들을 생성하여 곡선처럼 보이게 함
                const pathCoords = [];
                const steps = 10; // 중간점 개수
                
                for (let i = 0; i <= steps; i++) {
                    const ratio = i / steps;
                    const lat = startLat + (endLat - startLat) * ratio;
                    const lng = startLng + (endLng - startLng) * ratio;
                    
                    // 약간의 곡선 효과를 위해 중간점들을 살짝 이동
                    if (i > 0 && i < steps) {
                        const offset = Math.sin(ratio * Math.PI) * 0.001; // 작은 오프셋
                        pathCoords.push(new Tmapv2.LatLng(lat + offset, lng));
                    } else {
                        pathCoords.push(new Tmapv2.LatLng(lat, lng));
                    }
                }

                // 경로 선 표시 (점선으로 표시하여 대략적인 경로임을 나타냄)
                const polyline = new Tmapv2.Polyline({
                    path: pathCoords,
                    strokeWeight: 5,
                    strokeColor: '#0D2A5C',
                    strokeOpacity: 0.8,
                    strokeStyle: 'shortdash' // 점선으로 표시
                });

                polyline.setMap(map);
                resultdrawArr.push(polyline);

                const distance = calculateDistance(startLat, startLng, endLat, endLng);
                
                // 예상 시간 계산 (도보 평균 속도 4km/h 기준, 1km당 15분)
                estimatedTimeSeconds = Math.round((distance / 1000) * 15 * 60);
                
                // 거리 갱신 (예상 시간 정보와 함께)
                updateRemainingDistance();

                console.log(`대략적인 경로 - 거리: ${Math.round(distance / 1000 * 10) / 10}km, 시간: ${Math.round(distance / 1000 * 15)}분`);
            } catch (error) {
                console.error('직선 경로 표시 오류:', error);
            }
        }

        // 오류 표시
        function showError(message) {
            document.getElementById('loadingMessage').style.display = 'none';
            document.getElementById('errorMessage').style.display = 'block';
            document.getElementById('errorMessage').querySelector('div').textContent = message;
        }


        // 위치 추적 시작 - 정확도 개선
        function startLocationTracking() {
            if (navigator.geolocation) {
                let lastUpdateTime = 0;
                const minUpdateInterval = 5000; // 최소 5초 간격으로 업데이트
                
                watchId = navigator.geolocation.watchPosition(
                    (position) => {
                        const now = Date.now();
                        const accuracy = position.coords.accuracy;
                        
                        // 정확도가 너무 나쁘면 무시 (100m 이상)
                        if (accuracy > 100) {
                            console.log(`위치 정확도가 너무 낮음: ${Math.round(accuracy)}m - 무시`);
                            return;
                        }
                        
                        // 너무 자주 업데이트하지 않도록 제한
                        if (now - lastUpdateTime < minUpdateInterval) {
                            console.log('업데이트 간격이 너무 짧음 - 무시');
                            return;
                        }
                        
                        const newPosition = {
                            lat: position.coords.latitude,
                            lng: position.coords.longitude,
                            accuracy: position.coords.accuracy,
                            altitude: position.coords.altitude,
                            heading: position.coords.heading,
                            speed: position.coords.speed
                        };
                        
                        console.log(`위치 업데이트 - 정확도: ${Math.round(accuracy)}m`);
                        
                        // 위치가 크게 변경된 경우에만 업데이트
                        if (currentPosition) {
                            const distance = calculateDistance(
                                currentPosition.lat, currentPosition.lng,
                                newPosition.lat, newPosition.lng
                            );
                            
                            // 정확도가 개선되었거나 충분히 이동한 경우 업데이트
                            const accuracyImproved = accuracy < currentPosition.accuracy * 0.8; // 20% 이상 개선
                            const significantMovement = distance > 15; // 15m 이상 이동
                            
                            if (accuracyImproved || significantMovement) {
                                console.log(`위치 업데이트 조건 충족 - 거리: ${Math.round(distance)}m, 정확도 개선: ${accuracyImproved}`);
                                currentPosition = newPosition;
                                lastUpdateTime = now;
                                
                                // 100m 이동했는지 확인하여 남은 거리 갱신
                                if (lastDistanceUpdatePosition) {
                                    const distanceMoved = calculateDistance(
                                        lastDistanceUpdatePosition.lat,
                                        lastDistanceUpdatePosition.lng,
                                        newPosition.lat,
                                        newPosition.lng
                                    );
                                    
                                    if (distanceMoved >= 100) {
                                        console.log(`100m 이상 이동 감지: ${Math.round(distanceMoved)}m - 남은 거리 갱신`);
                                        lastDistanceUpdatePosition = {
                                            lat: newPosition.lat,
                                            lng: newPosition.lng
                                        };
                                        updateRemainingDistance();
                                    }
                                } else {
                                    // 첫 번째 거리 갱신 위치 설정 및 초기 거리 표시
                                    lastDistanceUpdatePosition = {
                                        lat: newPosition.lat,
                                        lng: newPosition.lng
                                    };
                                    updateRemainingDistance();
                                }
                                
                                updateMap();
                            } else {
                                console.log(`위치 업데이트 조건 미충족 - 거리: ${Math.round(distance)}m`);
                            }
                        } else {
                            // 첫 번째 위치 설정
                            currentPosition = newPosition;
                            lastUpdateTime = now;
                            
                            // 첫 거리 갱신 위치 설정 및 초기 거리 표시
                            lastDistanceUpdatePosition = {
                                lat: newPosition.lat,
                                lng: newPosition.lng
                            };
                            updateRemainingDistance();
                            updateMap();
                        }
                    },
                    (error) => {
                        console.error('위치 추적 오류:', error);
                        // 오류 발생 시 재시도
                        setTimeout(() => {
                            if (watchId) {
                                stopLocationTracking();
                                startLocationTracking();
                            }
                        }, 10000);
                    },
                    {
                        enableHighAccuracy: true,
                        timeout: 15000,
                        maximumAge: 10000 // 10초 이내의 위치만 사용
                    }
                );
            }
        }

        // 위치 추적 중지
        function stopLocationTracking() {
            if (watchId) {
                navigator.geolocation.clearWatch(watchId);
                watchId = null;
            }
        }

        // 두 지점 간 거리 계산 (미터)
        function calculateDistance(lat1, lng1, lat2, lng2) {
            const R = 6371e3; // 지구 반지름 (미터)
            const φ1 = lat1 * Math.PI/180;
            const φ2 = lat2 * Math.PI/180;
            const Δφ = (lat2-lat1) * Math.PI/180;
            const Δλ = (lng2-lng1) * Math.PI/180;

            const a = Math.sin(Δφ/2) * Math.sin(Δφ/2) +
                    Math.cos(φ1) * Math.cos(φ2) *
                    Math.sin(Δλ/2) * Math.sin(Δλ/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));

            return R * c;
        }

        // 남은 거리 업데이트 및 표시
        function updateRemainingDistance() {
            if (!currentPosition || !destinationCoords) return;

            const remainingDistance = calculateDistance(
                currentPosition.lat,
                currentPosition.lng,
                destinationCoords.lat,
                destinationCoords.lng
            );

            const distanceDisplay = document.getElementById('remainingDistanceDisplay');
            const distanceText = document.getElementById('remainingDistanceText');
            const timeText = document.getElementById('estimatedTimeText');

            if (distanceDisplay && distanceText && timeText) {
                // 거리 표시 포맷팅 (km 또는 m)
                if (remainingDistance >= 1000) {
                    const km = (remainingDistance / 1000).toFixed(1);
                    distanceText.textContent = `${km} km`;
                } else {
                    distanceText.textContent = `${Math.round(remainingDistance)} m`;
                }

                // 예상 시간 계산 및 표시
                let estimatedMinutes;
                if (estimatedTimeSeconds !== null) {
                    // Tmap API에서 받은 예상 시간이 있으면 사용
                    estimatedMinutes = Math.round(estimatedTimeSeconds / 60);
                } else {
                    // 직선 거리 기반 예상 시간 계산 (도보 평균 속도 4km/h, 1km당 15분)
                    estimatedMinutes = Math.round((remainingDistance / 1000) * 15);
                }
                
                // 예상 시간 표시 (1시간 이상이면 시간과 분으로 표시)
                if (estimatedMinutes >= 60) {
                    const hours = Math.floor(estimatedMinutes / 60);
                    const minutes = estimatedMinutes % 60;
                    if (minutes > 0) {
                        timeText.textContent = `예상 시간: ${hours}시간 ${minutes}분`;
                    } else {
                        timeText.textContent = `예상 시간: ${hours}시간`;
                    }
                } else {
                    timeText.textContent = `예상 시간: ${estimatedMinutes}분`;
                }

                // 표시 요소 보이기
                distanceDisplay.style.display = 'block';
            }

            console.log(`남은 거리 갱신: ${remainingDistance >= 1000 ? (remainingDistance / 1000).toFixed(1) + 'km' : Math.round(remainingDistance) + 'm'}`);
        }

        // 지도 업데이트
        function updateMap() {
            if (map && currentPosition) {
                try {
                    // 기존 마커와 경로 제거
                    clearMap();

                    // 거리 체크
                    const isWithinRange = checkDistanceAndShowPopup();

                    // 현재 위치 마커 업데이트
                    const currentMarker = new Tmapv2.Marker({
                        position: new Tmapv2.LatLng(currentPosition.lat, currentPosition.lng),
                        icon: "https://t1.daumcdn.net/localimg/localimages/07/mapapidoc/red_b.png",
                        iconSize: new Tmapv2.Size(24, 35),
                        map: map
                    });
                    currentMarkers.push(currentMarker);

                    // 목적지 마커 다시 추가
                    const destinationMarker = new Tmapv2.Marker({
                        position: new Tmapv2.LatLng(destinationCoords.lat, destinationCoords.lng),
                        icon: "https://t1.daumcdn.net/localimg/localimages/07/mapapidoc/blue_drag.png",
                        iconSize: new Tmapv2.Size(24, 35),
                        map: map
                    });
                    currentMarkers.push(destinationMarker);

                    // 지도 범위 조정 (현재 위치 중심으로)
                    adjustMapBounds();

                    // 경로 다시 계산 (30km 이내면 상세 경로, 초과하면 직선 경로)
                    if (isWithinRange) {
                        showRoute();
                    } else {
                        showStraightRoute();
                    }
                } catch (error) {
                    console.error('지도 업데이트 오류:', error);
                }
            }
        }

        // 초기 거리 표시 설정
        function initializeDistanceDisplay() {
            if (currentPosition && destinationCoords && !lastDistanceUpdatePosition) {
                lastDistanceUpdatePosition = {
                    lat: currentPosition.lat,
                    lng: currentPosition.lng
                };
                updateRemainingDistance();
            }
        }

        // 페이지 로드 시 실행
        window.addEventListener('load', async function() {
            try {
                console.log('페이지 로드 시작');
                
                // URL 파라미터에서 좌표 정보 가져오기
                const hasUrlParams = getUrlParameters();
                
                if (!hasUrlParams) {
                    console.log('URL 파라미터가 없음, 현재 위치를 가져오는 중...');
                    await getCurrentLocation();
                } else {
                    console.log('URL 파라미터에서 좌표를 가져왔음');
                }
                
                console.log('현재 위치:', currentPosition);
                console.log('목적지:', destinationCoords);
                
                // Tmap API 로드 확인 및 초기화
                function tryInitMap() {
                    console.log('Tmap API 확인 중...');
                    console.log('Tmapv2:', typeof Tmapv2);
                    console.log('Tmapv2.LatLng:', typeof Tmapv2?.LatLng);
                    console.log('window.tmapApiLoaded:', window.tmapApiLoaded);
                    console.log('window.tmapApiLoadError:', window.tmapApiLoadError);
                    
                    // API 로드 오류가 발생한 경우
                    if (window.tmapApiLoadError) {
                        console.error('Tmap API 로드 오류 발생');
                        showError('지도 API를 불러올 수 없습니다.');
                        return;
                    }
                    
                    // API가 완전히 로드된 경우
                    if (window.tmapApiLoaded || (typeof Tmapv2 !== 'undefined' && Tmapv2 && typeof Tmapv2.LatLng !== 'undefined')) {
                        console.log('Tmap API 완전히 로드됨, 지도 초기화 시작');
                        initMap();
                        
                        // 초기 거리 표시 설정
                        initializeDistanceDisplay();
                        
                        // 지도 초기화 후 위치 추적 시작
                        startLocationTracking();
                    } else {
                        console.log('Tmap API 대기 중...');
                        // 1초 후 다시 시도
                        setTimeout(tryInitMap, 1000);
                    }
                }

                tryInitMap();
            } catch (error) {
                console.error('위치 정보 가져오기 실패:', error);
                showError('위치 정보를 가져올 수 없습니다. 위치 권한을 허용해주세요.');
            }
        });

        // 페이지 언로드 시 위치 추적 중지
        window.addEventListener('beforeunload', function() {
            stopLocationTracking();
        });
    </script>
