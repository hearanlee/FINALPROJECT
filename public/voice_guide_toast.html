    <!-- 페이지 로드 시 자동 음성 안내 -->
    <script>
        // 1. hasPlayed 플래그를 스크립트 최상단으로 이동시킵니다.
        let hasPlayed = false;

        // 음성 안내 재생 함수
        function playWelcomeMessage() {
            // 2. 이미 재생되었다면 함수를 즉시 종료합니다.
            if (hasPlayed) return;

            // 3. 브라우저가 음성 합성을 지원하는지 확인
            if ('speechSynthesis' in window) {
                
                // 4. 안내할 텍스트 정의
                const ttsText = "마이크 버튼을 누르시면, 음성으로 주문을 도와드릴게요";
                
                // 5. 음성 메시지 객체 생성
                const utterance = new SpeechSynthesisUtterance(ttsText);
                
                // 6. 한국어로 설정 (정확한 발음을 위해 중요)
                utterance.lang = 'ko-KR';
                utterance.rate = 1.0; // 재생 속도 (1이 기본값)
                
                // 7. 음성 재생 실행
                try {
                    // 기존에 재생 중인 음성이 있으면 중지
                    window.speechSynthesis.cancel();
                    
                    window.speechSynthesis.speak(utterance);
                    
                    // 8. [핵심 수정] 재생에 성공하면 플래그를 true로 설정합니다.
                    hasPlayed = true; 
                    
                    console.log('TTS 음성 안내 시작');

                    // 9. 재생에 성공했으므로, 불필요한 이벤트 리스너를 제거합니다.
                    document.removeEventListener('click', handleFirstInteraction);
                    document.removeEventListener('touchstart', handleFirstInteraction);
                    
                } catch (e) {
                    console.error('TTS 재생 오류:', e);
                }
            } else {
                // 음성 합성을 지원하지 않는 브라우저의 경우
                console.error("이 브라우저는 음성 합성을 지원하지 않습니다.");
            }
        }
        
        // 1. 페이지 로드가 완료되면 함수 실행
        window.addEventListener('load', function() {
            // 자동 재생 정책을 고려하여 사용자 상호작용 후 재생 시도
            // 약간의 지연을 두고 재생 시도
            setTimeout(() => {
                playWelcomeMessage();
            }, 300);
        });
        
        // 사용자의 첫 상호작용(클릭/터치) 시 음성 재생
        // 자동 재생 정책을 우회하기 위한 함수
        function handleFirstInteraction() {
            // 10. [수정] 이 함수는 단순히 playWelcomeMessage를 호출하기만 하면 됩니다.
            //    (내부에서 hasPlayed 체크를 이미 하므로)
            playWelcomeMessage();
        }
        
        // 클릭 및 터치 이벤트 리스너 추가
        // 'once: true' 옵션 대신, 재생 성공 시 리스너를 제거하는 방식으로 변경
        document.addEventListener('click', handleFirstInteraction);
        document.addEventListener('touchstart', handleFirstInteraction);
    </script>
