<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">
    <title>Menu - Result</title>
    <link rel="stylesheet" href="menu.css">
</head>
<body>

    <div class="mobile-container">
        <header class="page-header">
            <a href="menu_step4.html"><img src="./images/icon-back-arrow.png" alt="뒤로 가기"></a>
            <h1>메뉴 추천</h1>
        </header>

        <main class="content">
            <div class="question-card">
                <p>네, 따뜻한 면요리를 원하시는군요.<br>'쌀국수'는 어떠세요?</p>
            </div>

            <div class="separator">
                <p>︾</p>
            </div>

            <img class="result-image" src="./images/pho.jpg" alt="쌀국수 사진">

            <div class="info-box">
                <p><strong>추천 메뉴:</strong> 쌀국수</p>
                <p><strong>키워드:</strong> 따뜻한, 국물 있는, 안매운 음식</p>
                <p><strong>가격대:</strong> 만원대</p>
            </div>
        </main>
        
        <div class="action-buttons">
             <a href="menu.html" class="btn btn-secondary" style="text-decoration: none; display: flex; justify-content: center; align-items: center;">메뉴 다시 고르기</a>
             <a href="restaurant_list.html" class="btn btn-primary" onclick="searchRestaurants()" style="text-decoration: none; display: flex; justify-content: center; align-items: center;">음식점 선택하기</a>
        </div>

        <nav class="bottom-nav">
            <a href="main.html" class="nav-item">
                <img src="./images/icon-home.png" alt="홈">
                <span>홈</span>
            </a>
            <a href="map_main.html" class="nav-item">
                <img src="./images/icon-map.png" alt="지도">
                <span>지도</span>
            </a>
            <a href="my_info.html" class="nav-item">
                <img src="./images/icon-user.png" alt="내정보">
                <span>내정보</span>
            </a>
        </nav>
    </div>

    <script>
        // 안전한 URL 생성 함수
        function createSafeUrl(baseUrl, params = {}) {
            try {
                let url = baseUrl;
                
                if (params && typeof params === 'object') {
                    const queryString = Object.keys(params)
                        .filter(key => params[key] !== null && params[key] !== undefined)
                        .map(key => {
                            const value = params[key];
                            // 객체인 경우 JSON 문자열로 변환
                            const stringValue = typeof value === 'object' ? JSON.stringify(value) : String(value);
                            return encodeURIComponent(key) + '=' + encodeURIComponent(stringValue);
                        })
                        .join('&');
                    
                    if (queryString) {
                        url += (url.includes('?') ? '&' : '?') + queryString;
                    }
                }
                
                console.log('생성된 URL:', url);
                return url;
            } catch (error) {
                console.error('URL 생성 오류:', error);
                return baseUrl;
            }
        }
        
        function searchRestaurants() {
            // 추천 메뉴명 추출
            const menuElement = document.querySelector('.info-box p:first-child');
            
            if (!menuElement) {
                console.error('메뉴 요소를 찾을 수 없습니다.');
                alert('메뉴 정보를 찾을 수 없습니다.');
                return;
            }
            
            const menuText = menuElement.textContent;
            console.log('메뉴 텍스트:', menuText);
            
            if (!menuText || !menuText.includes(':')) {
                console.error('메뉴 텍스트 형식이 올바르지 않습니다:', menuText);
                alert('메뉴 정보 형식이 올바르지 않습니다.');
                return;
            }
            
            const menuName = menuText.split(':')[1].trim();
            console.log('추출된 메뉴명:', menuName);
            
            if (!menuName || menuName === '') {
                console.error('메뉴명이 비어있습니다.');
                alert('메뉴명을 찾을 수 없습니다.');
                return;
            }
            
            // localStorage에 메뉴명 저장
            localStorage.setItem('searchKeyword', menuName);
            
            // URL 파라미터와 함께 restaurant_list.html로 이동
            const url = createSafeUrl('restaurant_list.html', { keyword: menuName });
            console.log('이동할 URL:', url);
            window.location.href = url;
        }
    </script>

</body>
</html>
