<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurant Detail</title>
    <link rel="stylesheet" href="menu.css">
</head>
<body>

    <div class="mobile-container">
        <header class="page-header">
            <a href="restaurant_list.html"><img src="./images/icon-back-arrow.png" alt="뒤로 가기"></a>
            <h1>매장 상세 안내</h1>
        </header>

        <main class="content detail-content">
            <img src="./images/map_image.png" alt="매장 지도" class="map-image">

            <div class="detail-card">
                <h2>포핸즈</h2>
                <p class="address">서울 동대문구 전농로 222 씨티빌라트 상가 2층 포핸즈</p>
                <div class="rating-line">
                    <span class="stars">★★★★☆</span>
                    <span class="rating-text">4.5 (128)</span>
                </div>
                <div class="tag">엘리베이터 사용 가능</div>
            </div>

            <div class="gallery">
                <img src="./images/food_photo1.png" alt="음식 사진 1">
                <img src="./images/food_photo2.png" alt="음식 사진 2">
                <img src="./images/food_photo3.png" alt="음식 사진 3">
            </div>

            <div class="detail-action-buttons">
                <a href="navigation.html" class="btn btn-primary full-width" style="text-decoration: none; display: flex; justify-content: center; align-items: center;">길찾기 안내 시작</a>
                <a href="voice_guide_banziha.html" class="btn btn-primary full-width" style="text-decoration: none; display: flex; justify-content: center; align-items: center;">키오스크 음성안내</a>
                <a href="restaurant_list.html" class="btn btn-secondary full-width" style="text-decoration: none; display: flex; justify-content: center; align-items: center;">뒤로 가기</a>
            </div>
        </main>
        
        <nav class="bottom-nav">
            <a href="main.html" class="nav-item">
                <img src="./images/icon-home.png" alt="홈">
                <span>홈</span>
            </a>
            <a href="map_main.html" class="nav-item active">
                <img src="./images/icon-map.png" alt="지도">
                <span>지도</span>
            </a>
            <a href="my_info.html" class="nav-item">
                <img src="./images/icon-user.png" alt="내정보">
                <span>내정보</span>
            </a>
        </nav>
    </div>

</body>
</html>
